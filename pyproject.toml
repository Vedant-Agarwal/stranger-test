[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stranger-test"
dynamic = ["version"]
description = "Tests MCP servers for cross-identity and delegated-authority (RFC 8693) authorization leaks."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vedant Agarwal" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "authorization",
    "confused-deputy",
]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
strangertest = "strangertest.cli:main"

[tool.setuptools]
packages = ["strangertest"]

[tool.setuptools.dynamic]
version = { attr = "strangertest.__version__" }
